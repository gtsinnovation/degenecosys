version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: degen_postgres_db
    restart: always
    environment:
      POSTGRES_USER: degen_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: degen_ecosystem_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U degen_admin -d degen_ecosystem_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - degen_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: degen_fastapi_engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env}
      ADMIN_WALLETS: ${ADMIN_WALLETS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - degen_network

networks:
  degen_network:
    driver: bridge

volumes:
  postgres_data:
