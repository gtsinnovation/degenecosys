# docker-compose.yml

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: degen_postgres_db
    restart: always
    environment:
      POSTGRES_USER: degen_admin
      POSTGRES_PASSWORD: degen_secure_password_2026
      POSTGRES_DB: degen_ecosystem_db
    ports:
      - "5433:5432" # Changed host port from 5432 to 5433 to bypass local system locks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U degen_admin -d degen_ecosystem_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - degen_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: degen_fastapi_engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://degen_admin:degen_secure_password_2026@db:5432/degen_ecosystem_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - degen_network

networks:
  degen_network:
    driver: bridge

volumes:
  postgres_data: